<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product | Intelligent Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-bg flex items-center justify-center min-h-screen m-0 p-4">
    <div class="glass-card p-8 w-full max-w-lg">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-white">Update Product</h2>
            <p class="text-slate-400 text-sm mt-1">Modifying: <span class="text-blue-400 font-bold">{{ product.name }}</span></p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-left">Product Name</label>
                <input type="text" name="name" value="{{ product.name }}" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-left">Stock Quantity</label>
                    <input type="number" name="quantity" value="{{ product.quantity }}" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-left">Price (₹)</label>
                    <input type="text" name="price" value="{{ product.price }}" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-left">Expiry Date</label>
                <input type="date" name="expiry" value="{{ product.expiry_date }}" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition mt-6">
                Apply Changes
            </button>
        </form>
        
        <div class="text-center mt-6">
            <a href="/dashboard" class="text-slate-400 hover:text-white text-sm transition">Cancel and Return</a>
        </div>
    </div>
</body>
</html>
