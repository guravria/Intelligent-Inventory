<!DOCTYPE html>
<html lang="en">
<head>
    <title>Business Login | Intelligent Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="creative-bg flex items-center justify-center min-h-screen m-0 p-4">
    <div class="glass-card p-10 w-full max-w-md text-center">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-white mb-2">Welcome Back</h1>
            <p class="text-slate-300">Access the Intelligent Inventory Terminal</p>
        </div>
        
        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Username" 
                   class="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            <input type="password" name="password" placeholder="Password" 
                   class="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            <button type="submit" 
                    class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/20">
                Access Dashboard
            </button>
        </form>
        
        <p class="mt-8 text-slate-400 text-sm">
            Don't have an account? <a href="/register" class="text-blue-400 font-bold hover:underline transition">Register Here</a>
        </p>
    </div>
</body>
</html>
