<!DOCTYPE html>
<html>
<head>
    <title>Add New Stock | Intelligent Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-bg flex items-center justify-center min-h-screen m-0 p-4">
    <div class="glass-card p-8 w-full max-w-lg">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-white">Add Inventory</h2>
            <p class="text-slate-400 text-sm mt-1">Register new items into the secure database.</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Product Name</label>
                <input type="text" name="name" placeholder="e.g. Oreo Biscuits" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Barcode ID</label>
                    <input type="text" name="barcode" placeholder="Unique ID" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Quantity</label>
                    <input type="number" name="quantity" placeholder="0" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Price (₹)</label>
                    <input type="number" step="0.01" name="price" placeholder="0.00" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Expiry Date</label>
                    <input type="date" name="expiry" class="w-full p-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition mt-6">
                Save to Inventory
            </button>
        </form>
        <a href="/dashboard" class="block text-center mt-6 text-slate-400 hover:text-white text-sm transition">← Back to Dashboard</a>
    </div>
</body>
</html>
