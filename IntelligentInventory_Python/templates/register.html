<!DOCTYPE html>
<html lang="en">
<head>
    <title>Business Registration | Intelligent Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="creative-bg flex items-center justify-center min-h-screen m-0 p-4">
    <div class="glass-card p-10 w-full max-w-md text-center">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-white mb-2">Join SaaS</h1>
            <p class="text-slate-300">Create your smart business account</p>
        </div>

        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Choose Username" 
                   class="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            <input type="password" name="password" placeholder="Choose Password" 
                   class="w-full p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            <button type="submit" 
                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-500/20">
                Register Now
            </button>
        </form>

        <p class="mt-8 text-slate-400 text-sm">
            Already have an account? <a href="/login" class="text-blue-400 font-bold hover:underline transition">Login Now</a>
        </p>
    </div>
</body>
</html>
