<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Inventory | Welcome</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 90%;
        }
        h1 {
            font-size: 2.8rem;
            color: #1a73e8;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #5f6368;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            background: #1a73e8;
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26,115,232,0.3);
        }
        .btn-secondary {
            background: white;
            color: #1a73e8;
            border: 2px solid #1a73e8;
        }
        .btn-secondary:hover {
            background: #f1f3f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Intelligent Inventory</h1>
        <p>A SaaS-based smart supply chain solution utilizing AI Computer Vision to automate stock management for modern businesses.</p>
        
        <div class="btn-container">
            <a href="/login" class="btn">Login</a>
            <a href="/register" class="btn btn-secondary">Get Started</a>
        </div>
    </div>
</body>
</html>
